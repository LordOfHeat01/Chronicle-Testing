<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Publication Management System</title>

<style>
body{
  font-family:Segoe UI,Tahoma;
  background:#f0f2f5;
  margin:0;
}
header{
  background:#1e3a8a;
  color:#fff;
  padding:20px;
  text-align:center;
}
nav{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:20px;
}
button.tab{
  padding:10px 26px;
  border:none;
  border-radius:8px;
  background:#3b82f6;
  color:white;
  font-weight:600;
  cursor:pointer;
}
button.tab.active{
  background:#1e40af;
}
.section{
  display:none;
  max-width:950px;
  margin:0 auto 40px;
  background:white;
  padding:25px;
  border-radius:12px;
}
.section.active{
  display:block;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}
input, select{
  padding:10px;
  border-radius:8px;
  border:1px solid #cbd5e1;
  width:100%;
}
.actions{
  margin:10px 0;
}
.fetch{background:#22c55e;color:white;}
.refresh{background:#6b7280;color:white;margin-left:10px;}
.submit{background:#3b82f6;color:white;margin-top:20px;}
.pub-type{
  font-weight:600;
  color:#1e3a8a;
  margin:10px 0;
}
button{
  padding:9px 18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>University Publication Management System</h1>
</header>

<nav>
<button class="tab active" onclick="openTab('publication')">Publication</button>
<button class="tab" onclick="openTab('course')">FDP</button>
</nav>

<!-- PUBLICATION SECTION -->
<div id="publication" class="section active">
<h3>Publication (Journal / Conference / Book Chapter)</h3>

<label>DOI</label>
<input id="doi" placeholder="10.xxxx/xxxxx">

<div class="actions">
<button class="fetch" onclick="fetchDOI()">Fetch</button>
<button class="refresh" onclick="clearPublication()">Refresh</button>
</div>

<div class="pub-type">
Detected Publication Type: <span id="pubType">--</span>
</div>

<div class="grid">
<input id="authors" placeholder="Authors">
<input id="title" placeholder="Paper / Chapter Title">
<input id="container" placeholder="Journal / Conference / Book Title">
<input id="volume" placeholder="Volume">
<input id="issue" placeholder="Issue">
<input id="isbnIssn" placeholder="ISBN / ISSN">
<input id="publisher" placeholder="Publisher">
<input id="date" type="date">
</div>

<button class="submit" onclick="submitPublication()">Submit</button>
</div>

<!-- COURSE / WORKSHOP / WEBINAR -->
<div id="course" class="section">
<h3>Course / Workshop / Webinar</h3>

<select id="eventType">
<option value="">Select Type</option>
<option>Course</option>
<option>Workshop</option>
<option>Webinar</option>
</select>

<div class="grid">
<input id="courseTitle" placeholder="Title">
<input id="courseBy" placeholder="Conducted By">
<input id="courseDate" type="date">
<input id="courseDuration" placeholder="Duration">
<input id="coursePlace" placeholder="Place / Online">
</div>

<button class="submit" onclick="submitCourse()">Submit</button>
</div>

<script>
function openTab(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

function formatDate(obj){
  if(!obj || !obj['date-parts']) return '';
  const d = obj['date-parts'][0];
  return `${d[0]}-${String(d[1]||1).padStart(2,'0')}-${String(d[2]||1).padStart(2,'0')}`;
}

async function fetchDOI(){
  const doi = document.getElementById('doi').value.trim();
  if(!doi) return alert('Enter DOI');

  try{
    const res = await fetch(`https://api.crossref.org/works/${doi}`);
    const item = (await res.json()).message;

    document.getElementById('authors').value =
      item.author ? item.author.map(a=>`${a.given} ${a.family}`).join(', ') : '';

    document.getElementById('title').value = item.title?.[0] || '';
    document.getElementById('container').value = item['container-title']?.[0] || '';
    document.getElementById('publisher').value = item.publisher || '';

    document.getElementById('volume').value = item.volume || '';
    document.getElementById('issue').value = item.issue || '';

    // ISBN for Books / Book Chapters, ISSN for Journals & Conferences
    let isbnIssnValue = '';
    if (item.type && item.type.includes('book')) {
      if (item.ISBN && item.ISBN.length > 0) {
        isbnIssnValue = item.ISBN.join(', ');
      }
    } else {
      if (item.ISSN && item.ISSN.length > 0) {
        isbnIssnValue = item.ISSN.join(', ');
      }
    }
    document.getElementById('isbnIssn').value = isbnIssnValue;

    document.getElementById('date').value =
      formatDate(item['published-print'] || item['published-online']);

    let type = 'Unknown';
    if(item.type === 'journal-article') type = 'Journal';
    else if(item.type === 'proceedings-article') type = 'Conference';
    else if(item.type && item.type.includes('book')) type = 'Book / Book Chapter';

    document.getElementById('pubType').textContent = type;
  }
  catch(err){
    alert('Error fetching DOI data');
  }
}

function clearPublication(){
  ['doi','authors','title','container','volume','issue','isbnIssn','publisher','date']
    .forEach(id=>document.getElementById(id).value='');
  document.getElementById('pubType').textContent='--';
}

function submitPublication(){
  alert('Publication submitted successfully');
}

function submitCourse(){
  alert('Course data submitted successfully');
}
</script>

</body>
</html>
